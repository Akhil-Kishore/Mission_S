version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mission_s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  server:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mission_s
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  postgres-data:
